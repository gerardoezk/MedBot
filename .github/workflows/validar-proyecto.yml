name: Validar proyecto MedBot

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad-seguridad:
    name: Pipeline de calidad, seguridad e IaC
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r ingestion/requirements.txt
          pip install -r requirements-dev.txt

      - name: Ejecutar tests con cobertura
        run: |
          python -m pytest --cov=app/src --cov=ingestion --cov-report=xml --cov-report=term -q

      - name: Analisis SonarQube / SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Omitir SonarQube si no hay token configurado
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SonarQube/SonarCloud no se ejecuto porque falta configurar SONAR_TOKEN en GitHub Secrets."

      - name: Ejecutar Git hooks con pre-commit
        run: python -m pre_commit run --all-files

      - name: Validar sintaxis Python
        run: python -m compileall app ingestion

      - name: Ejecutar Checkov sobre Terraform
        run: checkov -d infra --soft-fail

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Verificar formato Terraform
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Inicializar Terraform sin backend remoto
        working-directory: infra
        run: terraform init -backend=false

      - name: Validar configuracion Terraform
        working-directory: infra
        run: terraform validate

      - name: Construir imagen Docker de MedBot
        run: docker build -t medbot-app:ci app
